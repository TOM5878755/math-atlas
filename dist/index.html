<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02040b">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <meta name="description" content="一个可旋转、缩放和探索的 Three.js 3D 数学知识宇宙。">
  <title>Math Atlas 3D · 数学知识宇宙</title>
  <link rel="stylesheet" href="./styles.css?v=three-atlas-1">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="loading" class="loading"><div class="loading-star">✦</div><p>正在生成数学宇宙</p><span><i></i></span></div>
  <main id="app">
    <canvas id="universe" aria-label="可交互的三维数学知识星图"></canvas>
    <header class="topbar">
      <a class="brand" href="#" id="homeButton"><span class="brand-sigil">∑</span><span><b>MATH ATLAS</b><small>3D 数学知识宇宙</small></span></a>
      <div class="search-wrap"><span>⌕</span><input id="searchInput" type="search" placeholder="搜索分科、概念或方向…" autocomplete="off" aria-label="搜索数学知识"><div id="searchResults" class="search-results"></div></div>
      <button class="icon-button" id="helpButton" aria-label="查看操作说明">?</button>
    </header>
    <aside class="cluster-nav" aria-label="数学分科导航"><div class="nav-title"><span>知识星系</span><em id="nodeCount">0 STARS</em></div><div id="clusterList"></div></aside>
    <section class="intro-card" id="introCard">
      <p class="micro">A LIVING MAP OF MATHEMATICS</p><h1>数学不是目录，<br>而是一座<em>宇宙</em></h1>
      <p>拖动旋转，滚轮缩放。点击恒星进入分科，观察概念之间的层级与联系。</p><button id="startButton">开始探索 <span>→</span></button>
    </section>
    <section class="detail-panel" id="detailPanel" aria-live="polite">
      <button class="panel-close" id="closePanel" aria-label="关闭详情">×</button><div class="path" id="detailPath">数学宇宙</div>
      <div class="detail-heading"><span class="detail-star">✦</span><div><p id="detailType">核心</p><h2 id="detailTitle">数学</h2></div></div>
      <p class="detail-description" id="detailDescription"></p><div class="detail-meta"><span>下属星体</span><strong id="childCount">0</strong></div>
      <div class="child-list" id="childList"></div><button class="focus-button" id="focusButton">聚焦此星系</button>
    </section>
    <div class="controls-hint"><span><i>↔</i> 拖动旋转</span><span><i>＋</i> 滚动缩放</span><span><i>✦</i> 点击探索</span></div>
    <div class="view-tools"><button id="resetButton" title="返回全景">⌂</button><button id="rotateButton" class="active" title="自动旋转">↻</button></div>
  </main>
  <dialog id="helpDialog"><button id="closeHelp" class="dialog-close">×</button><p class="micro">NAVIGATION GUIDE</p><h2>在数学宇宙中航行</h2>
    <div class="help-grid"><div><b>01</b><h3>旋转</h3><p>鼠标或手指拖动星空，从任意角度观察知识结构。</p></div><div><b>02</b><h3>缩放</h3><p>滚轮或双指缩放，在全景和细分主题之间穿梭。</p></div><div><b>03</b><h3>探索</h3><p>点击恒星查看简介，再进入它的下属知识星体。</p></div></div>
  </dialog>
  <noscript>此网站需要启用 JavaScript 才能展示三维数学知识宇宙。</noscript>
  <script type="module" src="./app.js?v=three-atlas-1"></script>
</body>
</html>
